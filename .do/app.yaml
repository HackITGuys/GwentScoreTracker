# DigitalOcean App Platform spec for the Gwent Score Tracker web build
# (static site), served at https://gwent.hackitguys.com. Mirrors the live app;
# keep the app and component names as they are, the ingress rule refers to them.
#
# App Platform can't run Godot, so it doesn't build anything: GitHub Actions
# (.github/workflows/build.yml) exports the app and force-pushes the files to
# the `web-deploy` branch under public/. This site redeploys on every push there.
#
# Apply changes with:  doctl apps update <app-id> --spec .do/app.yaml
# (or Settings -> App Spec -> Edit in the control panel).
#
# No custom headers are needed: the Web export is single-threaded
# (variant/thread_support=false), so it doesn't need COOP/COEP.
name: sea-lion-app-2
region: lon
alerts:
  - rule: DEPLOYMENT_FAILED
  - rule: DOMAIN_FAILED
features:
  - buildpack-stack=ubuntu-22
domains:
  - domain: gwent.hackitguys.com
    type: PRIMARY
ingress:
  rules:
    - component:
        name: gwentscoretracker
      match:
        path:
          prefix: /
static_sites:
  - name: gwentscoretracker
    environment_slug: html
    github:
      repo: HackITGuys/GwentScoreTracker
      branch: web-deploy
      deploy_on_push: true
    source_dir: /public
