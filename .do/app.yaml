# DigitalOcean App Platform spec for the Gwent Score Tracker web build
# (static site, free tier), served at https://gwent.hackitguys.com.
#
# App Platform can't run Godot, so it doesn't build anything: GitHub Actions
# (.github/workflows/build.yml) exports the app and force-pushes the files to
# the `web-deploy` branch under public/. This site redeploys on every push there.
#
# The existing app (which used to serve index.html from main) is switched over
# once, either in the control panel (App -> Settings -> web component ->
# Source: branch web-deploy, autodeploy on; output directory "public") or with:
#   doctl apps update <app-id> --spec .do/app.yaml
# New app instead: doctl apps create --spec .do/app.yaml
#
# No custom headers are needed: the Web export is single-threaded
# (variant/thread_support=false), so it doesn't need COOP/COEP.
name: gwent-score-tracker
static_sites:
  - name: web
    github:
      repo: HackITGuys/GwentScoreTracker
      branch: web-deploy
      deploy_on_push: true
    environment_slug: html
    output_dir: public
    index_document: index.html
domains:
  - domain: gwent.hackitguys.com
    type: PRIMARY
