# Tests + web, desktop (Windows/Linux) and Android exports on every push / PR.
# Signed binaries for a published release are attached by release-assets.yml.
# Deploys when main changes (a merged release PR, see release-pr.yml):
#   - DigitalOcean App Platform: the export is force-pushed to the `web-deploy`
#     branch, which the App Platform static site (.do/app.yaml) auto-deploys.
#   - Optional GitHub Pages: Settings -> Pages -> Source: "GitHub Actions",
#     and repo variable DEPLOY_PAGES=true.
name: build

on:
  push:
    branches-ignore: [web-deploy]   # generated branch: no project to build
  pull_request:
  workflow_dispatch:
    inputs:
      deploy:
        description: "Publish this build to DigitalOcean (web-deploy branch)"
        type: boolean
        default: false

jobs:
  test-and-export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Godot version pinned in .godot-version (bumped by godot-update.yml);
      # see .github/actions/setup-godot.
      - uses: ./.github/actions/setup-godot

      - name: Import assets
        run: godot --headless --path . --import

      - name: Unit tests
        run: godot --headless --path . --script res://tests/run_tests.gd

      - name: Smoke tests
        run: |
          set -e
          for args in "2" "1"; do   # player mode: versus, solo
            echo "::group::smoke $args"
            godot --headless --path . --fixed-fps 60 --script res://tests/smoke_game.gd -- $args
            echo "::endgroup::"
          done

      - name: Export web
        run: |
          mkdir -p build/web
          touch build/.gdignore   # keep Godot from importing its own export output
          godot --headless --path . --export-release "Web" build/web/index.html
          test -f build/web/index.pck

      # The local test server is stdlib-only; check it still works on the
      # latest patched Python 3 against the fresh export.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
          check-latest: true

      - name: Test web server
        run: |
          set -euo pipefail
          python tools/serve_web.py --port 8060 &
          SERVER=$!
          for _ in $(seq 1 20); do curl -fsS -o /dev/null http://127.0.0.1:8060/ && break; sleep 0.5; done
          H="$RUNNER_TEMP/headers.txt"
          curl -fsSI http://127.0.0.1:8060/index.wasm | tee "$H"
          grep -qi '^content-type: application/wasm' "$H"
          grep -qi '^cache-control: no-store' "$H"
          grep -qi '^cross-origin-opener-policy: same-origin' "$H"
          grep -qi '^cross-origin-embedder-policy: require-corp' "$H"
          kill "$SERVER"

      - uses: actions/upload-artifact@v7
        with:
          name: gwent-web
          path: build/web

      # Self-contained desktop builds: the PCK is embedded, so each folder must
      # hold exactly one file (nothing next to the binary that could be swapped).
      - name: Export desktop
        run: |
          set -euo pipefail
          mkdir -p build/windows build/linux
          godot --headless --path . --export-release "Windows Desktop" build/windows/GwentScoreTracker.exe
          godot --headless --path . --export-release "Linux" build/linux/GwentScoreTracker.x86_64
          for d in build/windows build/linux; do
            ls -la "$d"
            test "$(ls -A "$d" | wc -l)" -eq 1
          done

      # Test APK, signed with a throwaway key made for this run (it can't
      # update an installed release build). Release APKs are signed with the
      # real key in release-assets.yml.
      - name: Export Android (test signing)
        run: |
          set -euo pipefail
          mkdir -p build/android
          KS="$RUNNER_TEMP/ci-test.keystore"
          keytool -genkeypair -keystore "$KS" -alias ci -keyalg RSA -keysize 2048 -validity 7 \
            -storepass ci-test-pass -keypass ci-test-pass -dname "CN=Gwent Score Tracker CI test build"
          export GODOT_ANDROID_KEYSTORE_RELEASE_PATH="$KS"
          export GODOT_ANDROID_KEYSTORE_RELEASE_USER=ci
          export GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD=ci-test-pass
          godot --headless --path . --export-release "Android" build/android/GwentScoreTracker.apk
          test -s build/android/GwentScoreTracker.apk
          rm -f "$KS"

      - uses: actions/upload-artifact@v7
        with:
          name: gwent-android-test
          path: build/android/GwentScoreTracker.apk

      - uses: actions/upload-artifact@v7
        with:
          name: gwent-desktop
          path: |
            build/windows
            build/linux

      - name: Prepare Pages artifact
        if: vars.DEPLOY_PAGES == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: build/web

  deploy-pages:
    needs: test-and-export
    if: vars.DEPLOY_PAGES == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  # The App Platform static site watches `web-deploy` (deploy_on_push). The
  # branch is rebuilt as a single commit each time, so it never grows.
  deploy-digitalocean:
    needs: test-and-export
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.deploy)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: web-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: gwent-web
          path: site/public

      - uses: actions/checkout@v7
        with:
          path: src
          sparse-checkout: deploy

      # Android download page: the release-signed APK from the latest GitHub
      # Release (attached by release-assets.yml), verified against its
      # SHA256SUMS. Never the per-run test APK: its key changes every build,
      # so Android would refuse it as an update.
      - name: Add the Android download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p dl site/public/download
          if ! gh release download -R "$GITHUB_REPOSITORY" -D dl --pattern '*-android-arm64.apk' --pattern SHA256SUMS 2>/dev/null \
              || ! ls dl/*-android-arm64.apk >/dev/null 2>&1; then
            echo "::warning::No release-signed APK in the latest release; the download page shows 'not available yet'."
            sed -e 's/{{TAG}}/not released yet/' -e 's/{{SHA256}}/-/' -e 's/{{AVAILABLE}}/hidden/' \
              src/deploy/download.html > site/public/download/index.html
            exit 0
          fi
          APK=$(ls dl/*-android-arm64.apk | head -n1)
          (cd dl && grep " $(basename "$APK")\$" SHA256SUMS | sha256sum -c -)
          TAG=$(basename "$APK" | sed -E 's/^GwentScoreTracker-(.*)-android-arm64\.apk$/\1/')
          SHA=$(sha256sum "$APK" | cut -d' ' -f1)
          cp "$APK" site/public/download/GwentScoreTracker.apk
          sed -e "s/{{TAG}}/${TAG}/g" -e "s/{{SHA256}}/${SHA}/" -e 's/{{AVAILABLE}}//' \
            src/deploy/download.html > site/public/download/index.html
          echo "Android ${TAG} (sha256 ${SHA}) added to /download/." >> "$GITHUB_STEP_SUMMARY"

      - name: Publish to the web-deploy branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -f site/public/index.html && test -f site/public/index.wasm && test -f site/public/index.pck
          cd site
          printf '%s\n' \
            "# Gwent Score Tracker web build" \
            "" \
            "Generated by .github/workflows/build.yml from ${GITHUB_REPOSITORY}@${GITHUB_SHA} (${GITHUB_REF_NAME})." \
            "Served by DigitalOcean App Platform (.do/app.yaml). Don't edit: it's replaced on every deploy." > README.md
          git init -q -b web-deploy
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Web build ${GITHUB_SHA::7} (${GITHUB_REF_NAME})"
          git push -fq "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" web-deploy
          echo "Deployed \`${GITHUB_SHA::7}\` from \`${GITHUB_REF_NAME}\` to the \`web-deploy\` branch." >> "$GITHUB_STEP_SUMMARY"
