# Publishing a GitHub Release builds the Windows and Linux executables from the
# release tag and attaches them (plus SHA256SUMS) to that release.
# Runs alongside release-pr.yml, which opens the develop -> main PR that deploys
# the web build.
#
# Each executable is self-contained: the game data (PCK) is embedded, and
# project-settings overrides (override.cfg) are disabled in exported builds.
name: desktop-release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to build and attach binaries to"
        required: true

permissions:
  contents: write

jobs:
  desktop:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      - name: Read Godot version
        run: |
          set -euo pipefail
          PIN=$(tr -d '[:space:]' < .godot-version)
          echo "GODOT_VERSION=${PIN%-*}" >> "$GITHUB_ENV"
          echo "GODOT_RELEASE=${PIN##*-}" >> "$GITHUB_ENV"

      - name: Cache Godot
        uses: actions/cache@v6
        with:
          path: ~/godot
          key: godot-${{ hashFiles('.godot-version') }}

      - name: Install Godot and export templates
        run: |
          set -euo pipefail
          V="${GODOT_VERSION}-${GODOT_RELEASE}"
          BASE="https://github.com/godotengine/godot-builds/releases/download/${V}"
          mkdir -p ~/godot && cd ~/godot
          if [ ! -x godot ]; then
            curl -fsSL -o godot.zip "${BASE}/Godot_v${V}_linux.x86_64.zip"
            unzip -q godot.zip && mv "Godot_v${V}_linux.x86_64" godot && rm godot.zip
            curl -fsSL -o templates.tpz "${BASE}/Godot_v${V}_export_templates.tpz"
            unzip -q templates.tpz && rm templates.tpz
          fi
          T="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_RELEASE}"
          mkdir -p "$T" && cp -r ~/godot/templates/. "$T"/
          echo "$HOME/godot" >> "$GITHUB_PATH"

      - name: Import assets
        run: godot --headless --path . --import

      - name: Unit tests
        run: godot --headless --path . --script res://tests/run_tests.gd

      - name: Export desktop
        run: |
          set -euo pipefail
          mkdir -p build/windows build/linux
          touch build/.gdignore
          godot --headless --path . --export-release "Windows Desktop" build/windows/GwentScoreTracker.exe
          godot --headless --path . --export-release "Linux" build/linux/GwentScoreTracker.x86_64
          for d in build/windows build/linux; do test "$(ls -A "$d" | wc -l)" -eq 1; done

      - name: Package
        run: |
          set -euo pipefail
          mkdir -p dist
          cp LICENSE README.md build/windows/
          cp LICENSE README.md build/linux/
          chmod +x build/linux/GwentScoreTracker.x86_64
          (cd build/windows && zip -q -9 "../../dist/GwentScoreTracker-${TAG}-windows-x86_64.zip" *)
          tar -C build/linux -czf "dist/GwentScoreTracker-${TAG}-linux-x86_64.tar.gz" .
          (cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS)

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$TAG" dist/* --clobber -R "$GITHUB_REPOSITORY"
          echo "Attached desktop builds to \`$TAG\`." >> "$GITHUB_STEP_SUMMARY"
